<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>TRIPU app icon</title>
  <desc>White car silhouette centered on a solid blue background</desc>
  <rect x="0" y="0" width="512" height="512" fill="#1A56DB"/>

  <!-- Car body -->
  <rect x="76" y="280" width="360" height="100" rx="24" fill="#FFFFFF"/>

  <!-- Cabin -->
  <polygon points="160,280 200,190 312,190 352,280" fill="#FFFFFF"/>

  <!-- Windows -->
  <polygon points="187,268 213,208 253,208 253,268" fill="#1A56DB"/>
  <polygon points="259,268 259,208 299,208 325,268" fill="#1A56DB"/>

  <!-- Front wheel -->
  <circle cx="160" cy="380" r="46" fill="#FFFFFF"/>
  <circle cx="160" cy="380" r="20" fill="#1A56DB"/>

  <!-- Rear wheel -->
  <circle cx="352" cy="380" r="46" fill="#FFFFFF"/>
  <circle cx="352" cy="380" r="20" fill="#1A56DB"/>
</svg>
